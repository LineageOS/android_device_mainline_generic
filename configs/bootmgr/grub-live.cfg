set gfxmode=auto
set gfxpayload=keep
if [ "$grub_platform" = "efi" ]; then
	set grub_gfx_module="efi_gop"
elif [ "$grub_platform" = "pc" ]; then
	set grub_gfx_module="vbe"
fi
if insmod $grub_gfx_module; then
	loadfont /boot/grub/fonts/unicode.pf2
	terminal_output gfxterm
fi

function boot_android {
    echo 'Loading kernel...'
    linux /@LIVEISOIMAGE_ANDROID_DIR_NAME@/kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ androidboot.android_dir=@LIVEISOIMAGE_ANDROID_DIR_NAME@ $@
    echo 'Loading ramdisk...'
    initrd /@LIVEISOIMAGE_ANDROID_DIR_NAME@/ramdisk.img
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live" {
    boot_android androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Copy system to RAM)" {
    boot_android androidboot.mount_system=imgs_ram androidboot.mount_userdata=tmpfs
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Enable serial console)" {
    boot_android @STRIPPED_BOARD_KERNEL_CMDLINE_SERIAL_CONSOLE@ androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Force using framebuffer display)" {
    boot_android androidboot.mount_system=imgs_ram androidboot.mount_userdata=tmpfs androidboot.use_fb_display=true
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
