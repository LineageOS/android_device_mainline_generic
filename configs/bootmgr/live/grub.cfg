set gfxmode=auto
set gfxpayload=keep
if [ "$grub_platform" = "efi" ]; then
	set grub_gfx_module="efi_gop"
elif [ "$grub_platform" = "pc" ]; then
	set grub_gfx_module="vbe"
fi
if insmod $grub_gfx_module; then
	loadfont /boot/grub/fonts/unicode.pf2
	terminal_output gfxterm
fi

function boot_android {
    echo 'Loading kernel...'
    linux /@BOOTMGR_ANDROID_DIR_NAME@/kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ androidboot.android_dir=@BOOTMGR_ANDROID_DIR_NAME@ $@
    echo 'Loading ramdisk...'
    initrd /@BOOTMGR_ANDROID_DIR_NAME@/ramdisk-all-combined.img
}

function boot_android_with_default_mount_options {
    boot_android androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs androidboot.mount_firmware=img $@
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live" {
    boot_android_with_default_mount_options
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Copy system to RAM)" {
    boot_android androidboot.mount_system=imgs_ram androidboot.mount_userdata=tmpfs androidboot.mount_firmware=img_ram
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Debug)" {
    boot_android_with_default_mount_options efi_pstore.pstore_disable=0 androidboot.first_stage_console=3 androidboot.insecure_adb=true androidboot.mode=console androidboot.save_early_logs=1
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Enable serial console)" {
    boot_android_with_default_mount_options @STRIPPED_BOARD_KERNEL_CMDLINE_SERIAL_CONSOLE@
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (Skip mounting firmware)" {
    boot_android androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs androidboot.mount_firmware=false
}

submenu "Advanced graphics options for @BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live" {
    menuentry "Force using framebuffer display" {
        boot_android_with_default_mount_options androidboot.use_fb_display=true
    }
    menuentry "Force using framebuffer display + Set SurfaceFlinger native window buffers format to HAL_PIXEL_FORMAT_BGRA_8888" {
        boot_android_with_default_mount_options androidboot.use_fb_display=true androidboot.sf_native_window_buffers_format=5
    }
    menuentry "Force using framebuffer display + Set SurfaceFlinger native window buffers format to HAL_PIXEL_FORMAT_RGBA_8888" {
        boot_android_with_default_mount_options androidboot.use_fb_display=true androidboot.sf_native_window_buffers_format=1
    }
    menuentry "Force using Swiftshader graphics" {
        boot_android_with_default_mount_options androidboot.graphics=swiftshader
    }
    menuentry "Force using Swiftshader graphics + Set SurfaceFlinger native window buffers format to HAL_PIXEL_FORMAT_BGRA_8888" {
        boot_android_with_default_mount_options androidboot.graphics=swiftshader androidboot.sf_native_window_buffers_format=5
    }
    menuentry "Force using Swiftshader graphics + Set SurfaceFlinger native window buffers format to HAL_PIXEL_FORMAT_RGBA_8888" {
        boot_android_with_default_mount_options androidboot.graphics=swiftshader androidboot.sf_native_window_buffers_format=1
    }
    menuentry "Select drm_hwcomposer HWC HAL" {
        boot_android_with_default_mount_options androidboot.hwc_apex=1
    }
    menuentry "Select drmfb-composer HWC HAL" {
        boot_android_with_default_mount_options androidboot.hwc_apex=2
    }
    menuentry "Minigbm: Unset generic backend" {
        boot_android_with_default_mount_options androidboot.minigbm_generic_backend=0
    }
    menuentry "Minigbm: Select dumb generic backend" {
        boot_android_with_default_mount_options androidboot.minigbm_generic_backend=2
    }
    menuentry "Minigbm: Select GBM Mesa generic backend" {
        boot_android_with_default_mount_options androidboot.minigbm_generic_backend=3
    }
    menuentry "Minigbm: Select staging generic backend" {
        boot_android_with_default_mount_options androidboot.minigbm_generic_backend=4
    }
    menuentry "Select drm_hwcomposer HWC HAL + Minigbm: Unset generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=1 androidboot.minigbm_generic_backend=0
    }
    menuentry "Select drm_hwcomposer HWC HAL + Minigbm: Select dumb generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=1 androidboot.minigbm_generic_backend=2
    }
    menuentry "Select drm_hwcomposer HWC HAL + Minigbm: Select GBM Mesa generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=1 androidboot.minigbm_generic_backend=3
    }
    menuentry "Select drm_hwcomposer HWC HAL + Minigbm: Select staging generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=1 androidboot.minigbm_generic_backend=4
    }
    menuentry "Select drmfb-composer HWC HAL + Minigbm: Unset generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=2 androidboot.minigbm_generic_backend=0
    }
    menuentry "Select drmfb-composer HWC HAL + Minigbm: Select dumb generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=2 androidboot.minigbm_generic_backend=2
    }
    menuentry "Select drmfb-composer HWC HAL + Minigbm: Select GBM Mesa generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=2 androidboot.minigbm_generic_backend=3
    }
    menuentry "Select drmfb-composer HWC HAL + Minigbm: Select staging generic backend" {
        boot_android_with_default_mount_options androidboot.hwc_apex=2 androidboot.minigbm_generic_backend=4
    }
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
